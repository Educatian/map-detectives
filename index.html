<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Map Detectives: students teach an AI to map land from the sky, find its mistakes in a rural town, and fix them.">
<title>Map Detectives</title>
<style>
  :root { --bg: #0f151b; --ink: #f2f4f6; --dim: #9aa6b2; --accent: #a3122f; --bar: #e8c77a; color-scheme: dark }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; }
  #unity-canvas { width: 100%; height: 100%; display: block; background: var(--bg); outline: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #1d2a35 0%, var(--bg) 70%); padding: 0 16px; }
  #loading .box { width: min(440px, 100%); }
  #loading h1 { font: 800 clamp(34px, 7vw, 56px)/0.95 "Barlow Condensed", system-ui, sans-serif; letter-spacing: .01em; margin: 0 0 10px; text-transform: uppercase; }
  #loading p { color: var(--dim); margin: 0 0 22px; }
  .track { height: 6px; border-radius: 3px; background: #26323d; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--bar); transition: width .2s; }
  #status { margin-top: 10px; font: 12px/1.4 ui-monospace, "IBM Plex Mono", monospace; color: var(--dim); }
  #err { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 8px; background: #3a1820; color: #ffd9df; }
  #pitch { display: inline-block; margin-top: 18px; color: var(--bar); font: 600 14px system-ui, sans-serif; text-decoration: none; border-bottom: 1px solid currentColor; }
  #fs { position: absolute; right: 12px; bottom: 12px; padding: 7px 12px; border-radius: 8px; border: 1px solid #ffffff33; background: #0f151bcc; color: var(--ink); font: 600 13px system-ui, sans-serif; cursor: pointer; display: none; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&display=swap">
</head>
<body>
<div id="wrap">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div class="box">
    <h1>Map<br>Detectives</h1>
    <p>Teach an AI to read the land from the sky, then take it somewhere it has never been. Desktop browser recommended (about 15 MB download).</p>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div id="status">Loading…</div>
    <div id="err"></div>
    <a id="pitch" href="https://youtu.be/lTcpLAkgCcE" target="_blank" rel="noopener">Watch the 2-minute pitch video ↗</a>
  </div></div>
  <button id="fs" type="button">Full screen</button>
</div>
<script>
  var canvas = document.getElementById('unity-canvas');
  var fill = document.getElementById('fill'), statusEl = document.getElementById('status'), errEl = document.getElementById('err');
  function fail(msg) { errEl.style.display = 'block'; errEl.textContent = 'Could not start the game here: ' + msg + ' Try a desktop Chrome or Edge window.'; statusEl.textContent = ''; }
  var config = {
    dataUrl: 'Build/WebGL.data.unityweb',
    frameworkUrl: 'Build/WebGL.framework.js.unityweb',
    codeUrl: 'Build/WebGL.wasm.unityweb',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'ADIE Lab, University of Alabama', productName: 'Map Detectives', productVersion: '1.0',
    autoSyncPersistentDataPath: true,
    showBanner: function (msg, type) { if (type === 'error') fail(msg); }
  };
  var s = document.createElement('script');
  s.src = 'Build/WebGL.loader.js';
  s.onerror = function () { fail('the loader script was blocked.'); };
  s.onload = function () {
    createUnityInstance(canvas, config, function (p) { fill.style.width = Math.round(p * 100) + '%'; statusEl.textContent = 'Loading ' + Math.round(p * 100) + '%'; })
      .then(function (u) {
        document.getElementById('loading').style.display = 'none';
        var fs = document.getElementById('fs'); fs.style.display = 'block';
        fs.onclick = function () { try { u.SetFullscreen(1); } catch (e) {} };
      })
      .catch(function (e) { fail(String(e && e.message || e)); });
  };
  document.body.appendChild(s);
</script>
</body>
</html>
